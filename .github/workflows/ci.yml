name: TCC Config CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Validate JSON Schemas
      run: python scripts/validate_migration.py
    - name: Deterministic QA Unit Tests
      run: python tests/test_qa_validation.py
    - name: LLM Evaluation Suite
      run: python scripts/run_llm_evals.py
    - name: Compile flat JSON
      run: python scripts/compile_for_trkxp.py
